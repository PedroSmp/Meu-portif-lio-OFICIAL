<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedro Sampaio — UI/UX Designer</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <div class="desktop" id="desktop">
    <div class="desktop-title">Pedro Sampaio — UI/UX Designer</div>

    <div class="icon-grid">

      <div class="icon" onclick="openModal('bemlar')" tabindex="0">
        <svg class="folder-svg" viewBox="0 0 58 46">
          <path d="M2 10 Q2 6 6 6 L22 6 L26 11 L52 11 Q56 11 56 15 L56 40 Q56 44 52 44 L6 44 Q2 44 2 40 Z" fill="#2E9CDB" stroke="#1B2E4B" stroke-width="1.5"/>
          <path d="M2 14 L56 14 L56 40 Q56 44 52 44 L6 44 Q2 44 2 40 Z" fill="#2E9CDB" stroke="#1B2E4B" stroke-width="1.5"/>
        </svg>
        <div class="icon-label">Bem Lar</div>
      </div>

      <div class="icon" onclick="openModal('agrirs')" tabindex="0">
        <svg class="folder-svg" viewBox="0 0 58 46">
          <path d="M2 10 Q2 6 6 6 L22 6 L26 11 L52 11 Q56 11 56 15 L56 40 Q56 44 52 44 L6 44 Q2 44 2 40 Z" fill="#3a8a4a" stroke="#246030" stroke-width="1.5"/>
          <path d="M2 14 L56 14 L56 40 Q56 44 52 44 L6 44 Q2 44 2 40 Z" fill="#4fae5e" stroke="#246030" stroke-width="1.5"/>
        </svg>
        <div class="icon-label">AgriRs</div>
      </div>

      <div class="icon" onclick="openModal('aluramed')" tabindex="0">
        <svg class="folder-svg" viewBox="0 0 58 46">
          <path d="M2 10 Q2 6 6 6 L22 6 L26 11 L52 11 Q56 11 56 15 L56 40 Q56 44 52 44 L6 44 Q2 44 2 40 Z" fill="#D5FEF9" stroke="#246030" stroke-width="1.5"/>
          <path d="M2 14 L56 14 L56 40 Q56 44 52 44 L6 44 Q2 44 2 40 Z" fill="#D5FEF9" stroke="#246030" stroke-width="1.5"/>
        </svg>
        <div class="icon-label">AluraMed</div>
      </div>

    </div>

    <div class="taskbar">
      <div class="dock-item" onclick="openModal('sobre')">
        <div class="dock-icon">
          <img src="./fotos/perfil-icon.svg" alt="Perfil">
        </div>
        <div class="dock-label">Perfil</div>
      </div>
      
      <div class="dock-item" onclick="openModal('skills')">
        <div class="dock-icon">
          <img src="./fotos/habilidades-icon.svg" alt="Habilidades">
        </div>
        <div class="dock-label">Habilidades</div>
      </div>
      
      <div class="dock-item" onclick="openModal('contato')">
        <div class="dock-icon">
          <img src="./fotos/email-icon.svg" alt="Contato">
        </div>
        <div class="dock-label">Contato</div>
      </div>
      
      <div class="dock-item" onclick="openModal('curriculo')">
        <div class="dock-icon">
          <img src="./fotos/cv-icon.svg" alt="Currículo">
        </div>
        <div class="dock-label">Currículo</div>
      </div>

      <div class="clock" id="clock">
        <div class="clock-time" id="clock-time">--:--</div>
        <div class="clock-date" id="clock-date">--/--/----</div>
      </div>
    </div>

    <div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">

        <div class="win-titlebar">
          <span class="win-titlebar-name" id="win-titlebar-name">—</span>
          <div class="win-titlebar-right">
            <div class="win-controls">
              <button class="win-btn" aria-label="Minimizar" onclick="closeModal()"><i class="win-ico win-ico-min"></i></button>
              <button class="win-btn" aria-label="Maximizar"><i class="win-ico win-ico-max"></i></button>
              <button class="win-btn win-btn-close" aria-label="Fechar" onclick="closeModal()"><i class="win-ico win-ico-close"></i></button>
            </div>
          </div>
        </div>

        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-footer"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
